name: Collect API odds

on:
  schedule:
    - cron: "10 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-api-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Collect odds
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run collect:api-odds:auto

      - name: Commit updated odds pack
        if: always()
        run: |
          if git diff --quiet -- data/api-odds-pack.js; then
            echo "No odds changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/api-odds-pack.js
          git commit -m "Update API odds pack"
          git push
